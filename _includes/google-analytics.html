<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics | uri_escape }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() { dataLayer.push(arguments); }
  gtag('js', new Date());
  gtag('config', {{ site.google_analytics | jsonify }}, {
    allow_google_signals: false,
    allow_ad_personalization_signals: false
  });
</script>
